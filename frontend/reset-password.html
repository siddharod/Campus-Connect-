<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – CampusConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
          </div>
          <span class="brand-text">Campus<span>Connect</span></span>
        </a>
        <h1>Reset Password</h1>
        <p>Set a secure new password for your college account.</p>
      </div>

      <form id="resetForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="resetToken" class="form-label">Reset Token</label>
          <input 
            type="text" 
            id="resetToken" 
            class="form-control" 
            placeholder="Paste your reset token" 
            required
          >
          <div class="invalid-feedback" id="tokenError">Token is required.</div>
        </div>

        <div class="form-group">
          <label for="newPassword" class="form-label">New Password (Min 6 chars)</label>
          <input 
            type="password" 
            id="newPassword" 
            class="form-control" 
            placeholder="••••••••" 
            required
          >
          <div class="invalid-feedback" id="newPassError">Password must be at least 6 characters.</div>
        </div>

        <div class="form-group">
          <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
          <input 
            type="password" 
            id="confirmNewPassword" 
            class="form-control" 
            placeholder="••••••••" 
            required
          >
          <div class="invalid-feedback" id="confirmPassError">Passwords do not match.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="btnResetSubmit" style="width: 100%;">
          <span id="btnResetText">Save New Password</span>
          <span id="btnResetSpinner" class="spinner" style="width: 18px; height: 18px; border-width: 2px; display: none; margin: 0;"></span>
        </button>

        <div class="auth-footer" style="margin-top: 1.5rem;">
          <a href="login.html" class="back-home-link">← Back to Login</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tokenParam = urlParams.get('token');
      if (tokenParam) {
        document.getElementById('resetToken').value = tokenParam;
      }

      const form = document.getElementById('resetForm');
      const tokenInp = document.getElementById('resetToken');
      const passInp = document.getElementById('newPassword');
      const confirmInp = document.getElementById('confirmNewPassword');
      const btn = document.getElementById('btnResetSubmit');
      const text = document.getElementById('btnResetText');
      const spinner = document.getElementById('btnResetSpinner');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        const token = tokenInp.value.trim();
        const newPassword = passInp.value;
        const confirmPassword = confirmInp.value;

        let hasError = false;
        if (!token) {
          showError(tokenInp, 'tokenError', 'Reset token is required.');
          hasError = true;
        }

        if (newPassword.length < 6) {
          showError(passInp, 'newPassError', 'Password must be at least 6 characters.');
          hasError = true;
        }

        if (newPassword !== confirmPassword) {
          showError(confirmInp, 'confirmPassError', 'Passwords do not match.');
          hasError = true;
        }

        if (hasError) return;

        btn.disabled = true;
        text.style.display = 'none';
        spinner.style.display = 'inline-block';

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword, confirmPassword })
          });
          const data = await res.json();

          btn.disabled = false;
          text.style.display = 'inline-block';
          spinner.style.display = 'none';

          if (res.ok && data.success) {
            showToast('Password Updated! 🔒', 'Redirecting to login portal...', 'success', 2500);
            setTimeout(() => {
              window.location.href = 'login.html?passwordReset=true';
            }, 1200);
          } else {
            showToast('Reset Failed', data.message || 'Invalid or expired token.', 'error');
            showError(tokenInp, 'tokenError', data.message);
          }
        } catch (err) {
          btn.disabled = false;
          text.style.display = 'inline-block';
          spinner.style.display = 'none';
          showToast('Network Error', 'Could not reach server.', 'error');
        }
      });

      function showError(inp, errId, msg) {
        inp.classList.add('is-invalid');
        const errEl = document.getElementById(errId);
        if (errEl) {
          errEl.textContent = msg;
          errEl.classList.add('show');
        }
      }

      function clearErrors() {
        document.querySelectorAll('.form-control').forEach(el => el.classList.remove('is-invalid'));
        document.querySelectorAll('.invalid-feedback').forEach(el => el.classList.remove('show'));
      }
    });
  </script>
</body>
</html>
