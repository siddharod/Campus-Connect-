<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile & Details – CampusConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon" style="width: 34px; height: 34px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
          </div>
          <span class="brand-text">Campus<span>Connect</span></span>
        </a>
      </div>

      <nav class="sidebar-nav" id="sidebarNavDynamic">
        <!-- Injected via JavaScript based on role -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-mini-profile">
          <div class="user-avatar" id="sidebarUserAvatar">U</div>
          <div class="user-info">
            <div class="user-name" id="sidebarUserName">User</div>
            <div class="user-role" id="sidebarUserRole">Member</div>
          </div>
        </div>
        <button class="btn-logout" id="btnLogout" onclick="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <h2 class="page-title">My Profile & Academic Details</h2>
        </div>

        <div class="topbar-right">
          <button class="notif-bell-btn" id="notifBellBtn" title="Notifications">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span class="notif-badge" id="notifBadge" style="display: none;">0</span>
          </button>
          <div class="notif-dropdown" id="notifDropdown">
            <div class="notif-header">
              <h4>Campus Notifications</h4>
            </div>
            <div class="notif-list" id="notifList"></div>
          </div>
          <button class="btn btn-primary btn-sm" id="btnOpenEditProfile">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            Edit Profile
          </button>
        </div>
      </header>

      <div class="main-content">
        <!-- Hero Profile Banner -->
        <div class="card animate-fade-in" style="margin-bottom: 2rem; padding: 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1.5rem;">
          <div style="display: flex; align-items: center; gap: 1.5rem;">
            <div class="profile-avatar-large" id="mainProfileAvatar" style="width: 80px; height: 80px; font-size: 2rem;">
              U
            </div>
            <div>
              <h1 id="mainProfileName" style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.25rem;">Loading Name...</h1>
              <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
                <span class="badge badge-primary" id="mainProfileRole">Role</span>
                <span class="badge badge-success" id="mainProfileStatus">Active Enrolled</span>
                <span style="color: var(--text-muted); font-size: 0.85rem;" id="mainProfileEmail">email@college.edu</span>
              </div>
            </div>
          </div>
          <div>
            <button class="btn btn-outline" id="btnTriggerEditSecondary">
              Update Information
            </button>
          </div>
        </div>

        <!-- 2 Section Detail Cards Grid -->
        <div class="dashboard-grid">
          <!-- Card 1: Personal Information -->
          <div class="card animate-fade-in animate-delay-1">
            <div class="content-card-header">
              <h3 class="content-card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Personal Information
              </h3>
            </div>

            <div class="profile-overview-grid">
              <div class="profile-field-item">
                <div class="profile-field-label">Full Name</div>
                <div class="profile-field-value" id="dispFullName">--</div>
              </div>

              <div class="profile-field-item">
                <div class="profile-field-label">Primary Email</div>
                <div class="profile-field-value" id="dispEmail">--</div>
              </div>

              <div class="profile-field-item">
                <div class="profile-field-label">Phone Number</div>
                <div class="profile-field-value" id="dispPhone">Not specified</div>
              </div>

              <div class="profile-field-item">
                <div class="profile-field-label">Date of Birth</div>
                <div class="profile-field-value" id="dispDob">Not provided</div>
              </div>
            </div>
          </div>

          <!-- Card 2: Academic / Professional Details -->
          <div class="card animate-fade-in animate-delay-2">
            <div class="content-card-header">
              <h3 class="content-card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
                <span id="titleAcademic">Academic Information</span>
              </h3>
            </div>

            <div class="profile-overview-grid" id="academicFieldsGrid">
              <!-- Dynamically populated based on Student or Teacher -->
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal-backdrop" id="editProfileModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Edit Profile Information</h3>
        <button type="button" class="modal-close" id="closeEditModal">&times;</button>
      </div>
      <form id="editProfileForm" novalidate>
        <div class="modal-body">
          <div class="form-grid-2">
            <div class="form-group" style="grid-column: 1 / -1;">
              <label for="editName" class="form-label">Full Name</label>
              <input type="text" id="editName" class="form-control" required>
            </div>

            <div class="form-group">
              <label for="editPhone" class="form-label">Phone Number</label>
              <input type="tel" id="editPhone" class="form-control" placeholder="9876543210">
            </div>

            <div class="form-group" id="editDobGroup">
              <label for="editDob" class="form-label">Date of Birth</label>
              <input type="date" id="editDob" class="form-control">
            </div>

            <div class="form-group" id="editCourseGroup">
              <label for="editCourse" class="form-label">Course</label>
              <select id="editCourse" class="form-control">
                <option value="Computer Engineering">Computer Engineering</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Electronics Engineering">Electronics Engineering</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
              </select>
            </div>

            <div class="form-group" id="editYearGroup">
              <label for="editYear" class="form-label">Year</label>
              <select id="editYear" class="form-control">
                <option value="First Year">First Year</option>
                <option value="Second Year">Second Year</option>
                <option value="Third Year">Third Year</option>
                <option value="Fourth Year">Fourth Year</option>
              </select>
            </div>

            <div class="form-group" id="editDivisionGroup">
              <label for="editDivision" class="form-label">Division</label>
              <select id="editDivision" class="form-control">
                <option value="A">Division A</option>
                <option value="B">Division B</option>
                <option value="C">Division C</option>
              </select>
            </div>

            <div class="form-group" id="editDeptGroup" style="display: none;">
              <label for="editDept" class="form-label">Department</label>
              <input type="text" id="editDept" class="form-control">
            </div>

            <div class="form-group" id="editDesignationGroup" style="display: none;">
              <label for="editDesignation" class="form-label">Designation</label>
              <input type="text" id="editDesignation" class="form-control">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btnCancelEdit">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btnSaveProfile">
            <span id="saveText">Save Changes</span>
            <span id="saveSpinner" class="spinner" style="width: 16px; height: 16px; border-width: 2px; display: none; margin: 0;"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = protectPage();
      if (!user) return;

      renderSidebarLinks(user.role);

      // Load Profile Data
      let currentProfile = {};
      try {
        const res = await authFetch('/api/users/me');
        const data = await res.json();
        if (data.success) {
          const u = data.user;
          const p = data.profile || {};
          currentProfile = { ...u, ...p };
          displayProfile(u, p);
        }
      } catch (err) {
        console.error('Error loading profile:', err);
      }

      function displayProfile(u, p) {
        document.getElementById('mainProfileName').textContent = u.name;
        document.getElementById('mainProfileRole').textContent = u.role;
        document.getElementById('mainProfileEmail').textContent = u.email;

        const initials = (u.name || 'U').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        document.getElementById('mainProfileAvatar').textContent = initials;

        document.getElementById('dispFullName').textContent = u.name;
        document.getElementById('dispEmail').textContent = u.email;
        document.getElementById('dispPhone').textContent = p.phone || 'Not specified';
        document.getElementById('dispDob').textContent = p.date_of_birth || 'Not recorded';

        const academicGrid = document.getElementById('academicFieldsGrid');
        if (u.role === 'Student') {
          academicGrid.innerHTML = `
            <div class="profile-field-item">
              <div class="profile-field-label">Roll Number</div>
              <div class="profile-field-value">${p.roll_no || 'CE101'}</div>
            </div>
            <div class="profile-field-item">
              <div class="profile-field-label">Enrolled Course</div>
              <div class="profile-field-value">${p.course || 'Computer Engineering'}</div>
            </div>
            <div class="profile-field-item">
              <div class="profile-field-label">Academic Year</div>
              <div class="profile-field-value">${p.year || 'Second Year'}</div>
            </div>
            <div class="profile-field-item">
              <div class="profile-field-label">Assigned Division</div>
              <div class="profile-field-value">Division ${p.division || 'A'}</div>
            </div>
            <div class="profile-field-item" style="grid-column: 1 / -1;">
              <div class="profile-field-label">Admission Year</div>
              <div class="profile-field-value">${p.admission_year || '2023'} (Batch 2023–27)</div>
            </div>
          `;
        } else {
          document.getElementById('titleAcademic').textContent = 'Department & Professional Info';
          academicGrid.innerHTML = `
            <div class="profile-field-item">
              <div class="profile-field-label">Employee ID</div>
              <div class="profile-field-value">${p.employee_id || 'EMP1001'}</div>
            </div>
            <div class="profile-field-item">
              <div class="profile-field-label">Department</div>
              <div class="profile-field-value">${p.department || 'Computer Engineering'}</div>
            </div>
            <div class="profile-field-item">
              <div class="profile-field-label">Designation</div>
              <div class="profile-field-value">${p.designation || 'Associate Professor'}</div>
            </div>
            <div class="profile-field-item">
              <div class="profile-field-label">Faculty Status</div>
              <div class="profile-field-value">Permanent Faculty</div>
            </div>
          `;
        }
      }

      // Modal Triggers
      const editModal = document.getElementById('editProfileModal');
      const openBtn = document.getElementById('btnOpenEditProfile');
      const openSecondary = document.getElementById('btnTriggerEditSecondary');
      const closeBtn = document.getElementById('closeEditModal');
      const cancelBtn = document.getElementById('btnCancelEdit');

      [openBtn, openSecondary].forEach(b => {
        if (b) b.addEventListener('click', () => {
          document.getElementById('editName').value = currentProfile.name || '';
          document.getElementById('editPhone').value = currentProfile.phone || '';
          document.getElementById('editDob').value = currentProfile.date_of_birth || '';

          if (user.role === 'Student') {
            document.getElementById('editCourse').value = currentProfile.course || 'Computer Engineering';
            document.getElementById('editYear').value = currentProfile.year || 'Second Year';
            document.getElementById('editDivision').value = currentProfile.division || 'A';
            document.getElementById('editDeptGroup').style.display = 'none';
            document.getElementById('editDesignationGroup').style.display = 'none';
          } else {
            document.getElementById('editCourseGroup').style.display = 'none';
            document.getElementById('editYearGroup').style.display = 'none';
            document.getElementById('editDivisionGroup').style.display = 'none';
            document.getElementById('editDobGroup').style.display = 'none';
            document.getElementById('editDeptGroup').style.display = 'block';
            document.getElementById('editDesignationGroup').style.display = 'block';
            document.getElementById('editDept').value = currentProfile.department || 'Computer Engineering';
            document.getElementById('editDesignation').value = currentProfile.designation || 'Associate Professor';
          }

          editModal.classList.add('show');
        });
      });

      [closeBtn, cancelBtn].forEach(b => {
        if (b) b.addEventListener('click', () => editModal.classList.remove('show'));
      });

      // Submit Edit Form
      const form = document.getElementById('editProfileForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          name: document.getElementById('editName').value.trim(),
          phone: document.getElementById('editPhone').value.trim()
        };

        if (user.role === 'Student') {
          payload.course = document.getElementById('editCourse').value;
          payload.year = document.getElementById('editYear').value;
          payload.division = document.getElementById('editDivision').value;
          payload.date_of_birth = document.getElementById('editDob').value;
        } else {
          payload.department = document.getElementById('editDept').value.trim();
          payload.designation = document.getElementById('editDesignation').value.trim();
        }

        const saveBtn = document.getElementById('btnSaveProfile');
        const text = document.getElementById('saveText');
        const spinner = document.getElementById('saveSpinner');
        saveBtn.disabled = true;
        text.style.display = 'none';
        spinner.style.display = 'inline-block';

        try {
          const res = await authFetch('/api/users/me', {
            method: 'PUT',
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          saveBtn.disabled = false;
          text.style.display = 'inline-block';
          spinner.style.display = 'none';

          if (result.success) {
            editModal.classList.remove('show');
            showToast('Profile Updated! ✅', 'Changes persisted to database.', 'success');
            currentProfile = { ...result.user, ...result.profile };
            displayProfile(result.user, result.profile);
            // Update cached user
            setCurrentUser(result.user);
            document.getElementById('sidebarUserName').textContent = result.user.name;
          } else {
            showToast('Update Failed', result.message || 'Error updating profile.', 'error');
          }
        } catch (err) {
          saveBtn.disabled = false;
          text.style.display = 'inline-block';
          spinner.style.display = 'none';
          showToast('Network Error', 'Could not save profile changes.', 'error');
        }
      });

      function renderSidebarLinks(role) {
        const nav = document.getElementById('sidebarNavDynamic');
        if (role === 'Teacher') {
          nav.innerHTML = `
            <a href="teacher-dashboard.html" class="nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
              <span>Dashboard</span>
            </a>
            <a href="students.html" class="nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              <span>Students</span>
            </a>
            <a href="attendance.html" class="nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
              <span>Mark Attendance</span>
            </a>
            <a href="marks.html" class="nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
              <span>Add Marks</span>
            </a>
            <a href="timetable.html" class="nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
              <span>Timetable</span>
            </a>
            <a href="notices.html" class="nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
              <span>Notices</span>
            </a>
            <a href="profile.html" class="nav-item active">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <span>My Profile</span>
            </a>
            <a href="settings.html" class="nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
              <span>Settings</span>
            </a>
          `;
        } else {
          nav.innerHTML = `
            <a href="student-dashboard.html" class="nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
              <span>Dashboard</span>
            </a>
            <a href="attendance.html" class="nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
              <span>My Attendance</span>
            </a>
            <a href="marks.html" class="nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
              <span>My Results</span>
            </a>
            <a href="timetable.html" class="nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
              <span>Timetable</span>
            </a>
            <a href="notices.html" class="nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
              <span>Notices</span>
            </a>
            <a href="profile.html" class="nav-item active">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <span>My Profile</span>
